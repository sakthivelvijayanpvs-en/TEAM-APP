
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAM APP CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#174ea6;color:white;padding:18px}
main{max-width:700px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px}
input,button,select,textarea{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccd5e1;border-radius:8px}
button{background:#174ea6;color:white;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none}.note{font-size:13px;color:#64748b}
</style>
</head>
<body>
<header><h2>TEAM APP</h2><div>Lead Management CRM</div></header>
<main>
<section class="card" id="login">
<h3>Login / Create Account</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">Login</button>
<button onclick="signUp()">Create account</button>
<p id="msg" class="note">Create accounts only for authorized users.</p>
</section>

<section class="card hidden" id="app">
<h3>Add New Lead</h3>
<form id="leadForm">
<input id="name" placeholder="Customer name" required>
<input id="phone" placeholder="Phone number" required>
<input id="location" placeholder="Location">
<input id="follow" type="date">
<select id="status">
<option>New</option><option>Follow-up</option>
<option>Interested</option><option>Approved</option>
<option>Disbursed</option><option>Rejected</option>
</select>
<textarea id="remarks" placeholder="Remarks"></textarea>
<button>Save Lead</button>
</form>
<h3>My Leads</h3>
<div id="leads">Loading leads...</div>
<button onclick="logout()">Logout</button>
</section>
</main>
<script>
const SUPABASE_URL="https://jaccqwfvtfpwuirarmtt.supabase.co";
const SUPABASE_KEY="sb_publishable_ffTmApZkygA81Erw0RuNXA_4HBqgYQ2";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let currentRole="member";

async function signIn(){
 const emailValue=document.getElementById("email").value.trim();
 const passwordValue=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({
  email:emailValue,password:passwordValue
 });
 if(error){
  document.getElementById("msg").textContent=error.message;
  return;
 }
 currentUser=data.user;
 await showApp();
}

async function signUp(){
 const emailValue=document.getElementById("email").value.trim();
 const passwordValue=document.getElementById("password").value;
 const {error}=await db.auth.signUp({
  email:emailValue,password:passwordValue
 });
 document.getElementById("msg").textContent=error
  ? error.message
  : "Account request submitted. Admin authorization may be required.";
}

async function showApp(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 const {data:roleData,error:roleError}=await db
  .from("team_roles")
  .select("role,display_name")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(roleError || !roleData){
  document.getElementById("msg").textContent=
   "Your account has not been authorized. Please contact Admin.";
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  return;
 }

 currentRole=roleData.role;
 await loadLeads();
}

async function loadLeads(){
 let query=db.from("leads").select("*")
  .order("created_at",{ascending:false});

 if(currentRole!=="admin"){
  query=query.eq("created_by",currentUser.id);
 }

 const {data,error}=await query;
 const leadsElement=document.getElementById("leads");

 if(error){
  leadsElement.textContent="Could not load leads: "+error.message;
  return;
 }

 if(!data || data.length===0){
  leadsElement.textContent="No leads yet";
  return;
 }

 leadsElement.innerHTML=data.map(l=>`
  <div class="card">
   <b>${escapeHtml(l.customer_name)}</b><br>
   Phone: ${escapeHtml(l.phone||"")}<br>
   Location: ${escapeHtml(l.location||"")}<br>
   ${currentRole==="admin"
    ? "Uploaded By: <b>"+escapeHtml(l.uploaded_by_name||"Unknown")+"</b><br>"
    : ""}
   Status: ${escapeHtml(l.status||"")}<br>
   Follow-up: ${escapeHtml(l.follow_up_date||"")}<br>
   Remarks: ${escapeHtml(l.remarks||"")}
  </div>
 `).join("");
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

document.getElementById("leadForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const {data,error:userError}=await db.auth.getUser();
 if(userError||!data.user){
  document.getElementById("msg").textContent="Please login again.";
  return;
 }

 const user=data.user;
 const {error}=await db.from("leads").insert({
  customer_name:document.getElementById("name").value.trim(),
  phone:document.getElementById("phone").value.trim(),
  location:document.getElementById("location").value.trim(),
  follow_up_date:document.getElementById("follow").value||null,
  status:document.getElementById("status").value,
  remarks:document.getElementById("remarks").value.trim(),
  created_by:user.id
 });

 if(error){
  document.getElementById("msg").textContent="Save failed: "+error.message;
  return;
 }

 document.getElementById("msg").textContent="Lead saved successfully!";
 e.target.reset();
 await loadLeads();
});

async function logout(){
 await db.auth.signOut();
 window.location.reload();
}

db.auth.getSession().then(async({data,error})=>{
 if(!error && data.session){
  currentUser=data.session.user;
  await showApp();
 }
});
</script>
</body>
</html>
