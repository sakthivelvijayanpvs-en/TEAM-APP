
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEAM APP CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#174ea6;color:white;padding:18px}
main{max-width:700px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px}
input,button,select,textarea{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccd5e1;border-radius:8px}
button{background:#174ea6;color:white;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none}.note{font-size:13px;color:#64748b}
</style>
</head>
<body>
<header><h2>TEAM APP</h2><div>Lead Management CRM</div></header>
<main>
<section class="card" id="login">
<h3>Login / Create Account</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">Login</button>
<button onclick="signUp()">Create account</button>
<p id="msg" class="note">Create accounts only for authorized users.</p>
</section>

<section class="card hidden" id="app">
<h3>Add New Lead</h3>
<form id="leadForm">
<input id="name" placeholder="Customer name" required>
<input id="phone" placeholder="Phone number" required>
<input id="location" placeholder="Location">
<input id="follow" type="date">
<select id="status">
<option>New</option><option>Follow-up</option>
<option>Interested</option><option>Approved</option>
<option>Disbursed</option><option>Rejected</option>
</select>
<textarea id="remarks" placeholder="Remarks"></textarea>
<button>Save Lead</button>
</form>
<h3>My Leads</h3>
<div id="leads">Loading leads...</div>
<button onclick="logout()">Logout</button>
</section>
</main>
<script>
const SUPABASE_URL="https://jaccqwfvtfpwuirarntt.supabase.co";
const SUPABASE_KEY="sb_publishable_ffTmApZkygA81Erw0RuNXA_4HBqgYQ2";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser;

async function signIn(){
 const {data,error}=await db.auth.signInWithPassword({
  email:email.value.trim(),password:password.value
 });
 if(error){msg.textContent=error.message;return}
 currentUser=data.user;await showApp();
}
async function signUp(){
 const {data,error}=await db.auth.signUp({
  email:email.value.trim(),password:password.value
 });
 msg.textContent=error?error.message:
  "Account request submitted. Verify email if required; Admin must authorize access.";
}
async function showApp(){
 login.classList.add("hidden");app.classList.remove("hidden");
 await loadLeads();
}
async function loadLeads(){
 const {data,error}=await db.from("leads").select("*").order("created_at",{ascending:false});
 leads.innerHTML=error?"Could not load leads: "+error.message:
  (data.length?data.map(l=>`<div class="card"><b>${escapeHtml(l.customer_name)}</b><br>${escapeHtml(l.phone)}<br>${escapeHtml(l.location||"")}<br>Status: ${escapeHtml(l.status)}<br>Follow-up: ${escapeHtml(l.follow_up_date||"")}<br>${escapeHtml(l.remarks||"")}</div>`).join(""):"No leads yet");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const leadForm = document.getElementById("leadForm");

leadForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("msg");
  const currentUser = await db.auth.getUser();

  if (currentUser.error || !currentUser.data.user) {
    msg.textContent = "Please login again.";
    return;
  }

  const { error } = await db.from("leads").insert({
    customer_name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    location: document.getElementById("location").value.trim(),
    follow_up_date: document.getElementById("follow").value || null,
    status: document.getElementById("status").value,
    remarks: document.getElementById("remarks").value.trim(),
    created_by: currentUser.data.user.id
  });

  if (error) {
    msg.textContent = "Save failed: " + error.message;
    return;
  }

  msg.textContent = "Lead saved successfully!";
  leadForm.reset();
  await loadLeads();
});
async function logout(){await db.auth.signOut();location.reload();}
db.auth.getSession().then(({data})=>{if(data.session){currentUser=data.session.user;showApp();}});
</script>
</body>
</html>
